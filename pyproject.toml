[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.uv.workspace]
members = ["src/packages/aind_physiology_fip", "src/packages/aind_physiology_fip_data_mappers"]

[tool.uv.sources]
aind-physiology-fip = { workspace = true }
aind-physiology-fip-data-mappers = { workspace = true }

[dependency-groups]
dev = ["pytest", "ruff", "codespell", "aind-physiology-fip[data]", "aind-physiology-fip-data-mappers"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "griffe-pydantic", "mkdocs-autorefs>=1.4.4", "griffe-typingdoc>=0.3.1", "pymdown-extensions", "aind-physiology-fip[data]"]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.8.4"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I"]
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "google" }

[tool.codespell]
skip = ".git,*.pdf,*.svg,./.bonsai,*.bonsai,*.Generated.cs,./site,uv.lock"
ignore-words-list = "nd"
